# Test-only workflow for the released upstream main artifact:
# login without registries (regional and global token) and password masking.
name: Live upstream main ECR token paths

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  live-test:
    name: ubuntu-latest no registries and masking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ECR_REGISTRY: 277125094980.dkr.ecr.us-west-2.amazonaws.com
      ECR_IMAGE: 277125094980.dkr.ecr.us-west-2.amazonaws.com/repro-k8s-global-token-cross-region-20261008:repro-global-token-20261008
      TEST_ROLE: arn:aws:iam::277125094980:role/ecr-login-mainline-live-test-20261117

    steps:
      - name: Ensure no Docker login before control
        shell: bash
        run: docker logout "$ECR_REGISTRY" || true

      - name: 'Control: pull without login must fail'
        id: control_pull
        continue-on-error: true
        shell: bash
        run: docker pull "$ECR_IMAGE"

      - name: Assert control pull failed
        if: always()
        shell: bash
        env:
          CONTROL_OUTCOME: ${{ steps.control_pull.outcome }}
        run: |
          if [ "$CONTROL_OUTCOME" != "failure" ]; then
            echo "Expected the pull without Docker login to fail; outcome was $CONTROL_OUTCOME." >&2
            exit 1
          fi
          echo "Control behaved as expected: unauthenticated pull failed."

      - name: Configure AWS credentials for regional lane
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.TEST_ROLE }}
          role-session-name: ecr-login-main-regional-noreg-20261117
          aws-region: us-west-2

      - name: Login with regional token without registries
        id: regional
        uses: aws-actions/amazon-ecr-login@35dfb302061979936da5cef0093650c138c4d3c9

      - name: 'Regional: registry output and masked password'
        shell: bash
        env:
          REGISTRY_OUTPUT: ${{ steps.regional.outputs.registry }}
          DOCKER_USERNAME: ${{ steps.regional.outputs.docker_username_277125094980_dkr_ecr_us_west_2_amazonaws_com }}
          DOCKER_PASSWORD: ${{ steps.regional.outputs.docker_password_277125094980_dkr_ecr_us_west_2_amazonaws_com }}
        run: |
          echo "registry output: $REGISTRY_OUTPUT"
          echo "docker_username output: $DOCKER_USERNAME"
          echo "docker_password output (must show as ***): $DOCKER_PASSWORD"
          [ "$REGISTRY_OUTPUT" = "$ECR_REGISTRY" ] || { echo "Unexpected registry output" >&2; exit 1; }
          [ "$DOCKER_USERNAME" = "AWS" ] || { echo "Unexpected username" >&2; exit 1; }
          [ -n "$DOCKER_PASSWORD" ] || { echo "Empty password output" >&2; exit 1; }

      - name: 'Regional: pull'
        shell: bash
        run: docker pull "$ECR_IMAGE"

      - name: Logout between regional and global lanes
        if: always()
        shell: bash
        run: docker logout "$ECR_REGISTRY" || true

      - name: Configure AWS credentials for global lane
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.TEST_ROLE }}
          role-session-name: ecr-login-main-global-noreg-20261117
          aws-region: us-west-2

      - name: Login with global token without registries
        id: global
        uses: aws-actions/amazon-ecr-login@35dfb302061979936da5cef0093650c138c4d3c9
        with:
          ecr-private-token-type: global-token

      - name: 'Global: registry output and masked password'
        shell: bash
        env:
          REGISTRY_OUTPUT: ${{ steps.global.outputs.registry }}
          DOCKER_USERNAME: ${{ steps.global.outputs.docker_username_277125094980_dkr_ecr_us_west_2_amazonaws_com }}
          DOCKER_PASSWORD: ${{ steps.global.outputs.docker_password_277125094980_dkr_ecr_us_west_2_amazonaws_com }}
        run: |
          echo "registry output: $REGISTRY_OUTPUT"
          echo "docker_username output: $DOCKER_USERNAME"
          echo "docker_password output (must show as ***): $DOCKER_PASSWORD"
          [ "$REGISTRY_OUTPUT" = "$ECR_REGISTRY" ] || { echo "Unexpected registry output" >&2; exit 1; }
          [ "$DOCKER_USERNAME" = "AWS" ] || { echo "Unexpected username" >&2; exit 1; }
          [ "${#DOCKER_PASSWORD}" -ge 64 ] || { echo "Global password output unexpectedly short" >&2; exit 1; }

      - name: 'Global: pull'
        shell: bash
        run: docker pull "$ECR_IMAGE"

      - name: Logout after global lane
        if: always()
        shell: bash
        run: docker logout "$ECR_REGISTRY" || true
