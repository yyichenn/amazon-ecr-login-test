# Test-only workflow; manually dispatched from the isolated branch.
name: Live ECR global token

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  live-test:
    name: GitHub-hosted runner live test
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: 277125094980.dkr.ecr.us-west-2.amazonaws.com
      ECR_IMAGE: 277125094980.dkr.ecr.us-west-2.amazonaws.com/repro-k8s-global-token-cross-region-20261008:repro-global-token-20261008
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build action
        run: npm ci && npm run package

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::277125094980:role/ecr-login-gha-live-test-20261111
          aws-region: us-west-2

      - name: 'Control: pull without login must fail'
        id: control_pull
        continue-on-error: true
        run: docker pull "$ECR_IMAGE"

      - name: Assert control pull failed
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.control_pull.outcome }}
        run: |
          if [ "$CONTROL_OUTCOME" != "failure" ]; then
            echo "Expected the pull without Docker login to fail; outcome was $CONTROL_OUTCOME." >&2
            exit 1
          fi

      - name: Logout after control
        if: always()
        run: docker logout "$ECR_REGISTRY" || true

      - name: Login with default regional token
        uses: ./
        with:
          registries: 277125094980

      - name: Pull with default regional token
        run: docker pull "$ECR_IMAGE"

      - name: Logout after default regional token
        if: always()
        run: docker logout "$ECR_REGISTRY" || true

      - name: Login with global token
        uses: ./
        with:
          registries: 277125094980
          ecr-private-token-type: global-token

      - name: Pull with global token
        run: docker pull "$ECR_IMAGE"

      - name: Logout after global token
        if: always()
        run: docker logout "$ECR_REGISTRY" || true
